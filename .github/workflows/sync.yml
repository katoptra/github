name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for all the tasks. LIST_FLOOR and OWNERS here change prune.'
        type: string
        default: ''
permissions:
  contents: read
  # The sync workflow of lib starts the next run if a run writes .run/chain. The runs of
  # this mirror do not write that file. But the workflow of lib cannot have more
  # permissions than this workflow gives it.
  actions: write
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@e18ef7d810f0a239a7f6908f55060d8e0f40ce2c # v2.6.1
    with: {vars: '${{ inputs.vars }}', timeout-minutes: 90}
    secrets: inherit
