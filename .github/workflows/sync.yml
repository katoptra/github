name: sync
on:
  workflow_dispatch:
    inputs:
      vars:
        description: 'KEY=value pairs for the pipeline; none are read today'
        type: string
        default: ''
permissions:
  contents: read
  actions: write   # the called workflow chains a run that left .run/chain; this one never does, but a called workflow cannot raise this
concurrency: {group: sync, cancel-in-progress: false}
jobs:
  sync:
    uses: katoptra/lib/.github/workflows/sync.yml@81fb6ee34abc7703087cfe4a303263febc912c6f # v2.0.0
    with: {vars: '${{ inputs.vars }}', timeout-minutes: 90}
    secrets: inherit
