# One runner, one image pull: the render diff and the offline check.
name: check
on: {pull_request: {}}
permissions: {contents: read}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: katoptra/lib/.github/actions/toolbox@f7b2a879da8006fa84d08e1c6e501af70821a9a1 # v2.2.1
        with: {op: 'false'}
      - run: task check
      - run: task run -- task offline
